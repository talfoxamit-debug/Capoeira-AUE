<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Capoeiristas playing in a roda at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f5c3c"/>
      <stop offset="0.5" stop-color="#0a3d2a"/>
      <stop offset="1" stop-color="#062619"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#ffe49c"/>
      <stop offset="0.35" stop-color="#ffd166"/>
      <stop offset="0.7" stop-color="#f5b820" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5b820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06301f"/>
      <stop offset="1" stop-color="#041c12"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- sun disc -->
  <circle cx="1184" cy="288" r="118" fill="#ffd874" opacity="0.9"/>
  <circle cx="1184" cy="288" r="118" fill="none" stroke="#fff2cf" stroke-opacity="0.5" stroke-width="2"/>

  <!-- distant palm silhouettes -->
  <g fill="#063421" opacity="0.85">
    <path d="M120 560 q14 -210 2 -340 q40 70 96 92 q-70 -10 -88 34 q60 -40 120 -8 q-72 0 -112 50 q66 -28 128 22 q-78 -8 -130 60 q60 -16 118 44 q-86 -2 -134 78 z"/>
  </g>
  <g fill="#063421" opacity="0.7" transform="translate(1430 600) scale(-1 1)">
    <path d="M120 0 q14 -190 2 -300 q36 62 86 82 q-62 -8 -78 30 q54 -34 108 -6 q-64 0 -100 44 q58 -24 114 20 z"/>
  </g>

  <!-- ground -->
  <path d="M0 690 Q800 640 1600 690 L1600 900 L0 900 Z" fill="url(#ground)"/>
  <!-- roda ring -->
  <ellipse cx="800" cy="800" rx="520" ry="84" fill="none" stroke="#f5b820" stroke-opacity="0.28" stroke-width="3"/>
  <ellipse cx="800" cy="800" rx="380" ry="60" fill="none" stroke="#f5b820" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Capoeirista A: au (cartwheel) silhouette, left -->
  <g transform="translate(560 760)" fill="none" stroke="#04241733" >
    <!-- soft shadow -->
    <ellipse cx="20" cy="58" rx="120" ry="20" fill="#021810" stroke="none" opacity="0.5"/>
  </g>
  <g transform="translate(548 470) scale(1.05)">
    <g stroke="#05281a" stroke-width="30" stroke-linecap="round" fill="none">
      <path d="M120 230 L122 150"/>           <!-- planted arm -->
      <path d="M122 150 Q150 110 150 92"/>    <!-- torso arch -->
      <path d="M150 92 L92 18"/>              <!-- leg 1 up -->
      <path d="M150 92 L196 30"/>             <!-- leg 2 up -->
      <path d="M122 150 L70 184"/>            <!-- second arm -->
    </g>
    <circle cx="108" cy="176" r="22" fill="#05281a"/>  <!-- head (inverted) -->
    <!-- gold rim light -->
    <g stroke="#f5b820" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M150 92 L92 18"/>
      <path d="M150 92 L196 30"/>
    </g>
  </g>

  <!-- Capoeirista B: meia-lua high kick silhouette, right -->
  <g transform="translate(900 455)">
    <g stroke="#05281a" stroke-width="30" stroke-linecap="round" fill="none">
      <path d="M120 70 L108 168"/>            <!-- torso -->
      <path d="M108 168 L96 290"/>            <!-- support leg -->
      <path d="M96 290 L132 300"/>            <!-- support foot -->
      <path d="M108 168 L208 78"/>            <!-- kicking leg high -->
      <path d="M115 100 L60 138"/>            <!-- arm back -->
      <path d="M115 100 L150 56"/>            <!-- arm up -->
    </g>
    <circle cx="124" cy="44" r="24" fill="#05281a"/>  <!-- head -->
    <g stroke="#f5b820" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M108 168 L208 78"/>
    </g>
  </g>

  <!-- floating spark particles -->
  <g fill="#ffd874" opacity="0.8">
    <circle cx="980" cy="200" r="3"/>
    <circle cx="1050" cy="430" r="2.5"/>
    <circle cx="700" cy="250" r="2"/>
    <circle cx="430" cy="330" r="2.5"/>
    <circle cx="1280" cy="520" r="2"/>
  </g>
</svg>
