<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Portrait of Mestre Cobra, capoeira master from Rio de Janeiro">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5c3c"/>
      <stop offset="1" stop-color="#062619"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffd874" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd874" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="800" fill="url(#tbg)"/>
  <rect width="640" height="800" fill="url(#tglow)"/>
  <circle cx="320" cy="250" r="180" fill="#ffd874" opacity="0.18"/>

  <!-- ginga stance silhouette -->
  <g transform="translate(180 210)">
    <g stroke="#04221600" fill="none"></g>
    <g stroke="#062c1d" stroke-width="40" stroke-linecap="round" fill="none">
      <path d="M150 120 L140 250"/>          <!-- torso -->
      <path d="M140 250 L86 380"/>           <!-- left leg -->
      <path d="M86 380 L60 408"/>
      <path d="M140 250 L210 372"/>          <!-- right leg back -->
      <path d="M210 372 L246 386"/>
      <path d="M150 150 L80 220"/>           <!-- left arm guard -->
      <path d="M150 150 L226 110"/>          <!-- right arm up -->
    </g>
    <circle cx="158" cy="86" r="34" fill="#062c1d"/>
    <g stroke="#f5b820" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M150 150 L226 110"/>
    </g>
  </g>

  <!-- name plate -->
  <g font-family="'Sora','Segoe UI',sans-serif">
    <text x="48" y="700" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="-1">Mestre Cobra</text>
    <text x="50" y="738" fill="#ffd874" font-size="22" font-weight="600" letter-spacing="3">RIO DE JANEIRO · CAPOEIRA AUÊ</text>
  </g>
  <rect x="48" y="640" width="64" height="6" rx="3" fill="#f5b820"/>

  <text x="320" y="56" text-anchor="middle" fill="#bcd6c8" font-family="'Sora',sans-serif" font-size="18" letter-spacing="2" opacity="0.7">REPLACE WITH PHOTO OF MESTRE COBRA</text>
</svg>
